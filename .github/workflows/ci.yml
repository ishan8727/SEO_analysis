name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:worker
      - name: Server secrets must not reach the client bundle
        run: |
          if grep -rIlE "GOOGLE_SERVER_KEY|GEMINI_API_KEY|TURNSTILE_SECRET|COOKIE_SECRET|HASH_SALT|INTERNAL_TOKEN|MOLI_TOKEN|LEAD_WEBHOOK_URL" .next/static; then
            echo "Server-only secret name found in .next/static" && exit 1
          fi
      # Values come from GitHub Actions secrets (runbook.md section 3); missing ones are skipped.
      # grep -F with the values in env vars: they never appear in the log (GitHub masks secrets too).
      - name: Secret values must not be in the repo or the client bundle
        env:
          V1: ${{ secrets.GOOGLE_SERVER_KEY }}
          V2: ${{ secrets.GEMINI_API_KEY }}
          V3: ${{ secrets.TURNSTILE_SECRET }}
          V4: ${{ secrets.COOKIE_SECRET }}
          V5: ${{ secrets.HASH_SALT }}
          V6: ${{ secrets.INTERNAL_TOKEN }}
          V7: ${{ secrets.MOLI_TOKEN }}
          V8: ${{ secrets.LEAD_WEBHOOK_URL }}
        run: |
          checked=0
          for name in V1 V2 V3 V4 V5 V6 V7 V8; do
            value="${!name}"
            [ -n "$value" ] || continue
            checked=$((checked + 1))
            if git grep -qF -- "$value" || grep -rqF -- "$value" .next/static; then
              echo "A secret value (env $name) was found in the repo or .next/static" && exit 1
            fi
          done
          echo "Checked $checked secret values"
