name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:worker
      - name: Server secrets must not reach the client bundle
        run: |
          if grep -rIl "GOOGLE_SERVER_KEY\|GEMINI_API_KEY\|WHATSAPP_ACCESS_TOKEN\|MOLI_TOKEN" .next/static; then
            echo "Server-only secret name found in .next/static" && exit 1
          fi
