# Full stack: docker compose up --build
# Only web is published to the host. Moli, Redis and Postgres stay on the compose network.
# For running Next/worker on the host instead, add docker-compose.dev.yml (see CLAUDE.md).
# Production (shared GCP VM) adds docker-compose.prod.yml: registry images, memory limits, no published ports.
# Memory limits live only there: rootless Podman on WSL rejects them.

x-app: &app
  image: local-seo-audit:local
  build:
    context: .
    args:
      NEXT_PUBLIC_GOOGLE_BROWSER_KEY: ${NEXT_PUBLIC_GOOGLE_BROWSER_KEY:-}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
      NEXT_PUBLIC_PHONE_COUNTRIES: ${NEXT_PUBLIC_PHONE_COUNTRIES:-}
      ONLINE_MODE: ${ONLINE_MODE:-on}
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql://app:app@postgres:5432/seoaudit
    REDIS_URL: redis://redis:6379
    MOLI_URL: http://moli:9222
    INTERNAL_APP_URL: http://web:3000 # worker → print page for the PDF
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    moli: { condition: service_started }

services:
  web:
    <<: *app
    ports: ["3000:3000"]
    environment:
      <<: *app-env
      SERVICE_NAME: web
    command: sh -c "node_modules/.bin/prisma migrate deploy && node_modules/.bin/next start"

  worker:
    <<: *app
    environment:
      <<: *app-env
      SERVICE_NAME: worker
    command: node dist-worker/index.mjs

  moli:
    build: ./docker/moli
    environment:
      MOLI_TOKEN: ${MOLI_TOKEN:?set MOLI_TOKEN (16+ chars) in .env}
    expose: ["9222"] # never publish in prod

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: seoaudit }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d seoaudit"]
      interval: 5s
      retries: 10

volumes:
  pg: {}
  redis: {}
